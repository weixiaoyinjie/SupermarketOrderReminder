name: Build Supermarket Order Reminder APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Works if you uploaded only the source ZIP (as in your previous builds).
      # The highest version ZIP wins if v1.0/v1.1 are still present.
      - name: Locate project or unpack newest ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'SupermarketOrderReminder*.zip' | sort -V | tail -n 1)"
          if [[ -n "$zip_file" ]]; then
            echo "Building from ZIP: $zip_file"
            mkdir -p "$RUNNER_TEMP/supermarket-source"
            unzip -q "$zip_file" -d "$RUNNER_TEMP/supermarket-source"
            settings_file="$(find "$RUNNER_TEMP/supermarket-source" -maxdepth 6 -type f -name settings.gradle -print -quit)"
            [[ -n "$settings_file" ]] || { echo 'ERROR: settings.gradle not found in source ZIP'; exit 1; }
            project_dir="$(dirname "$settings_file")"
          elif [[ -f "$GITHUB_WORKSPACE/settings.gradle" ]]; then
            project_dir="$GITHUB_WORKSPACE"
          elif [[ -f "$GITHUB_WORKSPACE/SupermarketOrderReminder/settings.gradle" ]]; then
            project_dir="$GITHUB_WORKSPACE/SupermarketOrderReminder"
          else
            echo 'ERROR: Neither Android source tree nor SupermarketOrderReminder*.zip found'
            exit 1
          fi
          [[ -f "$project_dir/app/build.gradle" ]] || { echo 'ERROR: app/build.gradle missing'; exit 1; }
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --project-dir "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SupermarketOrderReminder-v1.9-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
